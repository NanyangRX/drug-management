<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南陽藥局 · 藥品管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F2F0EB;
  --surface: #FAFAF7;
  --border: #E0DDD5;
  --border-strong: #C8C4BA;
  --text-1: #18180F;
  --text-2: #5C5950;
  --text-3: #9E9B93;
  --accent: #1C4A10;
  --accent-bg: #EAF2E5;
  --red: #B83228;
  --red-bg: #FAEAE8;
  --amber: #A05C08;
  --amber-bg: #FEF2E0;
  --purple: #5A3A8A;
  --purple-bg: #F2EDF8;
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans TC', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: var(--sans); color: var(--text-1); min-height: 100vh; display: flex; font-size: 14px; }

/* Sidebar */
.sidebar { width: 210px; min-height: 100vh; background: var(--text-1); display: flex; flex-direction: column; position: fixed; top:0; left:0; z-index:10; }
.logo { padding: 28px 22px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.logo-pharmacy-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.22em;
  font-family: var(--sans);
  margin-bottom: 8px;
  background: #1A4A2A;
  border: 1.5px solid #4A8A60;
  border-radius: 6px;
  padding: 6px 14px;
  display: inline-block;
  text-shadow: none;
}
.logo-divider {
  width: 28px;
  height: 2px;
  background: #7ABF65;
  border-radius: 1px;
  margin-bottom: 10px;
  opacity: 0.7;
}
.logo-title { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: 0.06em; }
.logo-sub { font-size: 10px; color: rgba(255,255,255,0.3); font-family: var(--mono); margin-top: 4px; }
.nav { padding: 18px 0; flex: 1; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 22px; font-size: 12.5px; color: rgba(255,255,255,0.42); cursor: pointer; border-left: 2px solid transparent; transition: all 0.12s; user-select: none; }
.nav-item:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.04); }
.nav-item.active { color: #fff; border-left-color: #7ABF65; background: rgba(255,255,255,0.07); }
.nav-icon { font-size: 15px; width: 18px; text-align: center; }
.sidebar-footer { padding: 20px 22px; border-top: 1px solid rgba(255,255,255,0.07); }
.sf-row { margin-bottom: 13px; }
.sf-row:last-child { margin-bottom: 0; }
.sf-num { font-size: 21px; font-weight: 600; color: #fff; font-family: var(--mono); line-height: 1; }
.sf-lbl { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 3px; }

/* Main */
.main { margin-left: 210px; flex: 1; padding: 36px 40px; min-height: 100vh; }
.page-head { margin-bottom: 26px; }
.page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.page-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; font-family: var(--mono); }
.page { display: none; }
.page.active { display: block; }

/* Controls */
.controls { display: flex; gap: 8px; margin-bottom: 12px; }
.search-input { flex: 1; padding: 9px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--sans); color: var(--text-1); outline: none; transition: border-color 0.12s; }
.search-input:focus { border-color: var(--border-strong); }
.search-input::placeholder { color: var(--text-3); }
.filter-select { padding: 9px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 12px; font-family: var(--sans); color: var(--text-1); outline: none; cursor: pointer; }
.result-meta { font-size: 11px; color: var(--text-3); font-family: var(--mono); margin-bottom: 12px; }

/* Drug card */
.drug-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 7px; transition: border-color 0.12s, box-shadow 0.12s; }
.drug-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.drug-card.is-ctrl { border-left: 3px solid var(--purple); }
.drug-card.is-expired { border-left: 3px solid var(--red); }
.drug-card.is-warn { border-left: 3px solid var(--amber); }
.dc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 9px; }
.dc-name { font-size: 13.5px; font-weight: 500; }
.dc-code { font-size: 10px; color: var(--text-3); font-family: var(--mono); margin-top: 2px; }
.dc-badges { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 500; font-family: var(--mono); white-space: nowrap; }
.b-ctrl { background: var(--purple-bg); color: var(--purple); }
.b-pend { background: var(--amber-bg); color: var(--amber); }
.b-ok { background: var(--accent-bg); color: var(--accent); }
.b-red { background: var(--red-bg); color: var(--red); }
.b-amber { background: var(--amber-bg); color: var(--amber); }
.dc-generic { font-size: 11px; color: var(--text-2); margin-bottom: 9px; }
.dc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.dc-cell { background: var(--bg); border-radius: var(--radius-sm); padding: 6px 9px; }
.dc-label { font-size: 10px; color: var(--text-3); margin-bottom: 2px; }
.dc-value { font-size: 12px; font-weight: 500; font-family: var(--mono); }
.dc-value.unknown { color: var(--text-3); font-weight: 400; font-family: var(--sans); }
.dc-value.v-red { color: var(--red); }
.dc-value.v-amber { color: var(--amber); }

/* Alert page */
.alert-section { margin-bottom: 28px; }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); font-family: var(--mono); margin-bottom: 10px; }
.alert-row { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 16px; margin-bottom: 6px; display: flex; align-items: center; gap: 14px; transition: border-color 0.12s; }
.alert-row:hover { border-color: var(--border-strong); }
.alert-row.a-red { background: var(--red-bg); border-color: #F0C4C0; }
.alert-row.a-amber { background: var(--amber-bg); border-color: #F5DFB8; }
.alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-red { background: var(--red); }
.dot-amber { background: var(--amber); }
.alert-body { flex: 1; }
.alert-name { font-size: 13px; font-weight: 500; }
.alert-meta { font-size: 11px; color: var(--text-2); margin-top: 2px; font-family: var(--mono); }
.alert-right { text-align: right; flex-shrink: 0; }
.alert-days-num { font-size: 18px; font-weight: 600; font-family: var(--mono); }
.alert-days-lbl { font-size: 10px; color: var(--text-3); }

/* Vendor */
.vendor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
.vendor-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; transition: border-color 0.12s; }
.vendor-card:hover { border-color: var(--border-strong); }
.vc-name { font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.vc-count { display: inline-block; font-size: 10px; font-family: var(--mono); background: var(--accent-bg); color: var(--accent); padding: 2px 7px; border-radius: 3px; margin-bottom: 8px; }
.vc-drugs { font-size: 11px; color: var(--text-2); line-height: 1.7; }

/* Overview */
.ov-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 28px; }
.ov-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.ov-num { font-size: 26px; font-weight: 600; font-family: var(--mono); line-height: 1; }
.ov-lbl { font-size: 11px; color: var(--text-2); margin-top: 6px; }
.shelf-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.shelf-key { width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--accent-bg); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--accent); font-family: var(--mono); flex-shrink: 0; }
.shelf-name { flex: 1; font-size: 12.5px; }
.shelf-n { font-size: 12px; font-weight: 500; font-family: var(--mono); width: 28px; text-align: right; }
.bar-track { width: 90px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-3); font-size: 13px; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 560px;
  max-width: 92vw;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.18);
}
.modal-header {
  padding: 20px 22px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.modal-vendor-name { font-size: 16px; font-weight: 600; }
.modal-tel {
  font-size: 13px;
  font-family: var(--mono);
  color: var(--accent);
  margin-top: 4px;
}
.modal-close {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--border);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2);
  flex-shrink: 0;
  transition: background 0.12s;
}
.modal-close:hover { background: var(--border); }
.modal-count {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-3);
  padding: 8px 22px;
  border-bottom: 1px solid var(--border);
}
.modal-body { overflow-y: auto; padding: 12px 16px; }
.modal-drug-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 10px;
  border-radius: var(--radius-sm);
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.modal-drug-row:last-child { border-bottom: none; }
.modal-drug-row:hover { background: var(--bg); }
.mdr-left { flex: 1; }
.mdr-name { font-size: 13px; font-weight: 500; }
.mdr-generic { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.mdr-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
.mdr-shelf {
  font-size: 11px;
  font-family: var(--mono);
  background: var(--accent-bg);
  color: var(--accent);
  padding: 2px 7px;
  border-radius: 4px;
}
.mdr-ctrl {
  font-size: 10px;
  font-family: var(--mono);
  background: var(--purple-bg);
  color: var(--purple);
  padding: 2px 7px;
  border-radius: 4px;
}

/* Mobile hamburger menu */
.hamburger-btn {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 200;
  background: #1A4A2A;
  border: 1.5px solid #4A8A60;
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  align-items: center;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.hamburger-label {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.15em;
  font-family: var(--sans);
  white-space: nowrap;
}

.hamburger-icon {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}

.hamburger-icon span {
  display: block;
  width: 18px;
  height: 2px;
  background: #fff;
  border-radius: 1px;
  transition: all 0.2s;
}

.overlay-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 150;
}

.overlay-bg.open { display: block; }

@media (max-width: 680px) {
  .hamburger-btn { display: flex; }

  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.22s ease;
    z-index: 160;
  }

  .sidebar.open { transform: translateX(0); }

  .main {
    margin-left: 0;
    padding: 70px 18px 24px;
  }

  .ov-stats { grid-template-columns: repeat(2, 1fr); }
  .vendor-grid { grid-template-columns: 1fr; }
  .dc-grid { grid-template-columns: repeat(2, 1fr); }
  .card-row2 { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 680px) {
  .logo { display: none; }
}
</style>
</head>
<body>


<button class="hamburger-btn" id="hamburger-btn" onclick="toggleMenu()" aria-label="開啟選單">

    <span></span>
    <span></span>
    <span></span>
  </div>
  <span class="hamburger-label">南陽藥局</span>
</button>
<div class="overlay-bg" id="overlay-bg" onclick="closeMenu()"></div>
<aside class="sidebar" id="sidebar">
  <div class="logo">

  <nav class="nav">

    <div class="nav-item" onclick="showPage('vendor',this)"><span class="nav-icon">⊞</span> 廠商一覽</div>

</aside>

<main class="main">

  <!-- 查藥 -->
  <div id="page-search" class="page active">
    <div class="page-head">
      <div class="page-title">查藥</div>
      <div class="page-sub">輸入藥名、成分、代碼或廠商名稱搜尋</div>
    </div>
    <div class="controls">
      <input class="search-input" id="q" placeholder="例：Merislon、Betahistine、衛采…" oninput="renderSearch()" />
      <select class="filter-select" id="fil" onchange="renderSearch()">
        <option value="">全部藥品</option>
        <option value="exp">效期警示</option>
        <option value="ctrl">管制藥品</option>
        <option value="pend">庫存待確認</option>
        <option value="ok">庫存已確認</option>
      </select>
    </div>
    <div class="result-meta" id="search-meta"></div>
    <div id="search-list"></div>
  </div>

  <!-- 效期預警 -->
  <div id="page-alert" class="page">
    <div class="page-head">
      <div class="page-title">效期預警</div>
      <div class="page-sub">自動列出即將到期藥品，依緊急程度排序（模擬資料）</div>
    </div>
    <div class="alert-section">
      <div class="section-label">▲ 30天內到期</div>
      <div id="alert-urgent"></div>
    </div>
    <div class="alert-section">
      <div class="section-label">△ 31–90天內到期</div>
      <div id="alert-warn"></div>
    </div>
  </div>

  <!-- 廠商 -->
  <div id="page-vendor" class="page">
    <div class="page-head">
      <div class="page-title">廠商一覽</div>
      <div class="page-sub">依供應品項數量排序</div>
    </div>
    <div class="result-meta" id="vendor-meta"></div>
    <div class="vendor-grid" id="vendor-list"></div>
  </div>

  <!-- 總覽 -->
  <div id="page-overview" class="page">
    <div class="page-head">
      <div class="page-title">總覽</div>
      <div class="page-sub">建檔狀態與貨架分布</div>
    </div>
    <div class="ov-stats">
      <div class="ov-card"><div class="ov-num">65</div><div class="ov-lbl">已建檔藥品</div></div>
      <div class="ov-card"><div class="ov-num" id="ov-exp" style="color:var(--red)"></div><div class="ov-lbl">效期警示</div></div>
      <div class="ov-card"><div class="ov-num" id="ov-ctrl" style="color:var(--purple)"></div><div class="ov-lbl">管制藥品</div></div>
      <div class="ov-card"><div class="ov-num" id="ov-vendor"></div><div class="ov-lbl">供應廠商數</div></div>
    </div>
    <div class="section-label">貨架分布</div>
    <div id="shelf-list"></div>
  </div>

</main>

const today = new Date('2026-06-08');

function daysUntil(s) {
  if (!s || s==='?') return 9999;
  const [y,m] = s.split('/');
  return Math.round((new Date(+y, +m-1, 1) - today) / 86400000);
}

function expStatus(d) {
  const days = daysUntil(d.expiry);
  if (days <= 30) return 'urgent';
  if (days <= 90) return 'warn';
  return 'ok';
}

function expBadge(d) {
  const days = daysUntil(d.expiry);
  if (days <= 0) return '<span class="badge b-red">已過期</span>';
  if (days <= 30) return `<span class="badge b-red">${days}天後到期</span>`;
  if (days <= 90) return `<span class="badge b-amber">${days}天後到期</span>`;
  return '';
}

// Compute stats
const expCount = drugs.filter(d => daysUntil(d.expiry) <= 90).length;
const ctrlCount = drugs.filter(d => d.ctrl).length;
const pendCount = drugs.filter(d => d.stock==='?').length;
const vendorCount = [...new Set(drugs.filter(d=>d.vendor!=='?').map(d=>d.vendor))].length;

document.getElementById('sf-exp').textContent = expCount;
document.getElementById('sf-ctrl').textContent = ctrlCount;
document.getElementById('sf-pend').textContent = pendCount;
document.getElementById('ov-exp').textContent = expCount;
document.getElementById('ov-ctrl').textContent = ctrlCount;
document.getElementById('ov-vendor').textContent = vendorCount;

function cardClass(d) {
  if (d.ctrl) return ' is-ctrl';
  const s = expStatus(d);
  if (s==='urgent') return ' is-expired';
  if (s==='warn') return ' is-warn';
  return '';
}

function expCellClass(d) {
  const s = expStatus(d);
  if (s==='urgent') return ' v-red';
  if (s==='warn') return ' v-amber';
  return '';
}

function renderSearch() {
  const q = (document.getElementById('q').value||'').toLowerCase();
  const fil = document.getElementById('fil').value;
  const f = drugs.filter(d => {
    const mq = !q || d.name.toLowerCase().includes(q) || d.generic.toLowerCase().includes(q) || d.code.toLowerCase().includes(q) || d.vendor.toLowerCase().includes(q);
    const days = daysUntil(d.expiry);
    const mf = !fil ||
      (fil==='exp'  && days <= 90) ||
      (fil==='ctrl' && d.ctrl) ||
      (fil==='pend' && d.stock==='?') ||
      (fil==='ok'   && d.stock!=='?');
    return mq && mf;
  });
  document.getElementById('search-meta').textContent = `顯示 ${f.length} / ${drugs.length} 筆`;
  document.getElementById('search-list').innerHTML = f.length ? f.map(d => `
    <div class="drug-card${cardClass(d)}">
      <div class="dc-top">
        <div><div class="dc-name">${d.name}</div><div class="dc-code">${d.code}</div></div>
        <div class="dc-badges">
          ${d.ctrl ? '<span class="badge b-ctrl">管制</span>' : ''}
          ${expBadge(d)}
          ${d.stock==='?' ? '<span class="badge b-pend">庫存待確認</span>' : '<span class="badge b-ok">有庫存位置</span>'}
        </div>
      </div>
      <div class="dc-generic">${d.generic}</div>
      <div class="dc-grid">
        <div class="dc-cell"><div class="dc-label">貨架位置</div><div class="dc-value">${d.shelf}</div></div>
        <div class="dc-cell"><div class="dc-label">庫存位置</div><div class="dc-value${d.stock==='?' ? ' unknown' : ''}">${d.stock==='?' ? '待確認' : d.stock}</div></div>
        <div class="dc-cell"><div class="dc-label">效期</div><div class="dc-value${expCellClass(d)}">${d.expiry}</div></div>
        <div class="dc-cell"><div class="dc-label">廠商</div><div class="dc-value${d.vendor==='?' ? ' unknown' : ''}">${d.vendor==='?' ? '未填' : d.vendor}</div></div>
      </div>
    </div>`).join('') : '<div class="empty-state">找不到符合的藥品</div>';
}

function renderAlert() {
  const sorted = [...drugs].filter(d => daysUntil(d.expiry) <= 90).sort((a,b) => daysUntil(a.expiry) - daysUntil(b.expiry));
  const urgent = sorted.filter(d => daysUntil(d.expiry) <= 30);
  const warn   = sorted.filter(d => { const x=daysUntil(d.expiry); return x>30 && x<=90; });

  const makeRow = (d, cls, dotCls) => {
    const days = daysUntil(d.expiry);
    const label = days <= 0 ? '已過期' : `${days} 天`;
    const color = days <= 30 ? 'var(--red)' : 'var(--amber)';
    return `<div class="alert-row ${cls}">
      <div class="alert-dot ${dotCls}"></div>
      <div class="alert-body">
        <div class="alert-name">${d.name}</div>
        <div class="alert-meta">${d.shelf}｜效期 ${d.expiry}｜${d.vendor==='?'?'廠商未填':d.vendor}</div>
      </div>
      <div class="alert-right">
        <div class="alert-days-num" style="color:${color}">${label}</div>
        <div class="alert-days-lbl">剩餘效期</div>
      </div>
    </div>`;
  };

  document.getElementById('alert-urgent').innerHTML = urgent.length
    ? urgent.map(d => makeRow(d,'a-red','dot-red')).join('')
    : '<div class="empty-state">目前無 30 天內到期藥品</div>';

  document.getElementById('alert-warn').innerHTML = warn.length
    ? warn.map(d => makeRow(d,'a-amber','dot-amber')).join('')
    : '<div class="empty-state">目前無 31–90 天到期藥品</div>';
}

function renderVendor() {
  const map = {};
  drugs.forEach(d => {
    if (d.vendor==='?') return;
    if (!map[d.vendor]) map[d.vendor]=[];
    map[d.vendor].push(d.name);
  });
  const entries = Object.entries(map).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById('vendor-meta').textContent = `共 ${entries.length} 家廠商`;
  document.getElementById('vendor-list').innerHTML = entries.map(([v,names]) => `
    <div class="vendor-card" onclick="openVendor('${v}')" style="cursor:pointer">
      <div class="vc-name">${v} <span style="font-size:10px;color:var(--text-3);font-family:var(--mono)">→ 點擊查看</span></div>
      <span class="vc-count">${names.length} 項藥品</span>
      <div class="vc-drugs">${names.slice(0,5).map(n=>n.split(' ').slice(0,2).join(' ')).join('、')}${names.length>5?'…':''}</div>
    </div>`).join('');
}

function renderOverview() {
  const map = {};
  drugs.forEach(d => {
    const k = d.shelf.replace(/[?抽\s下後倉()]/g,'').charAt(0).toUpperCase() || '其';
    if (!map[k]) map[k]=0;
    map[k]++;
  });
  const max = Math.max(...Object.values(map));
  document.getElementById('shelf-list').innerHTML = Object.entries(map)
    .sort((a,b)=>b[1]-a[1])
    .map(([k,v]) => `
      <div class="shelf-row">
        <div class="shelf-key">${k}</div>
        <div class="shelf-name">${k} 區</div>
        <div class="shelf-n">${v}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v/max*100)}%"></div></div>
      </div>`).join('');
}

function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if (name==='alert')    renderAlert();
  if (name==='vendor')   renderVendor();
  if (name==='overview') renderOverview();
}
